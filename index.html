<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>PRIVY VAULT</title>
    <meta name="description" content="Vault kata sandi terenkripsi sisi-klien dengan AES-256-GCM dan Argon2id." />
    <meta property="og:title" content="PRIVY VAULT" />
    <meta property="og:description" content="Vault kata sandi terenkripsi sisi-klien dengan AES-256-GCM dan Argon2id." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" />
    <meta name="theme-color" content="#0B0D12" />
    <style>
      :root{--bg:#0B0D12;--card:#151922;--gold:#D6B15E;--tx:#F3F4F6;--mut:#8B93A3;--bd:#262B38;--bad:#E5736B;--ok:#6FBF8E;color-scheme:dark}
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
      h1,h2,h3{margin:0 0 12px;font-weight:600}
      h1 span,.gt{color:var(--gold)}
      .mut{color:var(--mut)}
      code{font-family:ui-monospace,monospace;color:var(--gold);word-break:break-all}
      #app.shell{display:flex;min-height:100vh}
      aside{width:230px;border-right:1px solid var(--bd);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
      aside .logo{font-weight:700;letter-spacing:.12em;margin:0 8px 18px}
      aside .logo span{color:var(--gold)}
      .nv{background:none;border:0;color:var(--mut);text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font:inherit}
      .nv.on{color:var(--gold);background:var(--card);border:1px solid var(--bd)}
      main{flex:1;padding:28px;max-width:960px}
      .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
      .grid .card{margin:0}
      .big{font-size:26px;font-weight:600;margin-top:4px}
      input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font:inherit;margin:4px 0 10px}
      input[type=checkbox]{width:auto;margin:0 8px 0 0}
      label{display:block;color:var(--mut);font-size:13px}
      label.chk{display:flex;align-items:center;margin-bottom:12px}
      button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
      button:hover{border-color:var(--gold)}
      button:disabled{opacity:.5}
      .btn.gold{background:var(--gold);color:#0B0D12;border-color:var(--gold);font-weight:600}
      .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
      .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
      .bar input,.bar select{flex:1;min-width:140px;margin:0}
      .tag{font-size:12px;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;color:var(--mut)}
      .auth{max-width:420px;margin:12vh auto;padding:28px}
      .err{color:var(--bad);min-height:20px}
      .ok{color:var(--ok)}
      .bad{color:var(--bad)}
      dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:min(480px,92vw)}
      dialog::backdrop{background:#000a}
      #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#0B0D12;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
      #toast.on{opacity:1}
      @media(max-width:800px){
        #app.shell{display:block}
        aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px;background:var(--bg);border-top:1px solid var(--bd);border-right:0;z-index:5;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
        .logo,.nv .t{display:none}
        .nv{padding:10px;font-size:18px;text-align:center}
        main{padding:16px 14px 90px}
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="auth card"><h1>PRIVY <span>VAULT</span></h1><p class="mut">Memuat aplikasi…</p></div></div>
    <noscript><div class="auth card"><h1>PRIVY <span>VAULT</span></h1><p class="err">Aktifkan JavaScript untuk menjalankan aplikasi ini.</p></div></noscript>
    <dialog id="dlg"></dialog>
    <div id="toast"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
