<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>DINOSITIVE</title>
    <meta name="description" content="Pengelola sandi dan encoder terenkripsi sisi-klien dengan AES-256 dan Argon2id." />
    <meta property="og:title" content="DINOSITIVE" />
    <meta property="og:description" content="Pengelola sandi dan encoder terenkripsi sisi-klien dengan AES-256 dan Argon2id." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" />
    <meta name="theme-color" content="#0B0D12" />
    <style>
      :root{
        --bg:#0B0D12;
        --surface:#131722;
        --surface-2:#1A2030;
        --gold:#D6B15E;
        --gold-dim:rgba(214,177,94,.14);
        --tx:#F3F4F6;
        --mut:#8B93A3;
        --bd:#242A38;
        --bad:#E5736B;
        --ok:#6FBF8E;
        color-scheme:dark;
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
      body{min-height:100dvh;padding-top:env(safe-area-inset-top)}
      h1,h2,h3{margin:0 0 12px;font-weight:600;letter-spacing:-.01em}
      h1{font-size:24px}
      h2{font-size:20px;margin-bottom:16px}
      h3{font-size:16px}
      h1 span,.gt{color:var(--gold)}
      .mut{color:var(--mut);font-size:14px}
      code{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;color:var(--gold);word-break:break-all}

      #app.shell{display:flex;min-height:100dvh}
      .mob-bar{display:none}

      aside{
        width:240px;
        flex-shrink:0;
        background:var(--surface);
        border-right:1px solid var(--bd);
        padding:24px 14px;
        display:flex;
        flex-direction:column;
        gap:6px;
        position:sticky;
        top:0;
        height:100dvh;
      }
      .logo{font-weight:700;font-size:18px;letter-spacing:.12em;margin:0 10px 20px;white-space:nowrap}
      .logo span{color:var(--gold)}

      .nv{
        display:flex;
        align-items:center;
        gap:10px;
        background:none;
        border:1px solid transparent;
        color:var(--mut);
        text-align:left;
        padding:11px 12px;
        min-height:44px;
        border-radius:12px;
        cursor:pointer;
        font:inherit;
        font-weight:500;
        white-space:nowrap;
        transition:background .15s,color .15s,border-color .15s;
      }
      .nv svg{width:20px;height:20px;flex-shrink:0}
      .nv:hover{color:var(--tx);background:rgba(255,255,255,.03)}
      .nv.on{color:var(--gold);background:var(--gold-dim);border-color:rgba(214,177,94,.28)}
      .nv.desk-lock{margin-top:auto}

      main{flex:1;padding:32px;max-width:760px;width:100%;margin:0 auto}

      .card{
        background:var(--surface);
        border:1px solid var(--bd);
        border-radius:16px;
        padding:20px;
        margin-bottom:14px;
      }
      .auth{width:min(440px,calc(100% - 32px));margin:8dvh auto;padding:24px}

      label{display:block;color:var(--mut);font-size:13px;font-weight:500;margin-bottom:6px}
      input,select,textarea{
        width:100%;
        min-height:46px;
        background:var(--bg);
        color:var(--tx);
        border:1px solid var(--bd);
        border-radius:12px;
        padding:11px 14px;
        font:16px/1.4 inherit;
        margin:0 0 14px;
        outline:none;
        transition:border-color .15s,box-shadow .15s;
      }
      input:focus,select:focus,textarea:focus{
        border-color:var(--gold);
        box-shadow:0 0 0 3px rgba(214,177,94,.16);
      }
      input[readonly]{background:var(--surface-2);font-family:ui-monospace,monospace;letter-spacing:.06em;font-weight:600;color:var(--gold)}
      input[type=checkbox]{width:20px;height:20px;min-height:20px;margin:0 10px 0 0;accent-color:var(--gold);flex-shrink:0}
      label.chk{display:flex;align-items:center;margin:4px 0 16px;color:var(--tx);font-size:14px;min-height:40px;cursor:pointer}

      button{
        min-height:44px;
        background:var(--surface-2);
        color:var(--tx);
        border:1px solid var(--bd);
        border-radius:12px;
        padding:10px 16px;
        cursor:pointer;
        font:inherit;
        font-weight:500;
        white-space:nowrap;
        transition:transform .12s,border-color .15s,background .15s,opacity .15s;
      }
      button:active{transform:scale(.98)}
      button:hover{border-color:var(--gold)}
      button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
      button:disabled{opacity:.48;cursor:not-allowed;transform:none}
      .btn.gold{background:var(--gold);color:#0B0D12;border-color:var(--gold);font-weight:600}
      .btn.gold:hover{filter:brightness(1.06)}

      .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;margin-bottom:18px}
      .seg button{min-height:38px;padding:8px 10px;border:0;background:transparent;color:var(--mut);border-radius:9px;font-size:14px}
      .seg button:hover{color:var(--tx)}
      .seg button.on{background:var(--gold-dim);color:var(--gold);font-weight:600}

      .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 14px}
      .sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
      .sk-grid .sk-item{margin:0}
      .sk-grid .sk-item label{margin-bottom:4px;font-size:12px}
      .sk-grid .sk-item input{margin:0;min-height:42px;padding:9px 12px;font-size:15px}
      .sk-grid .sk-item.full{grid-column:1 / -1}
      .sk-preview{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;min-height:44px;display:flex;align-items:center}

      .err{color:var(--bad);min-height:20px;font-size:14px;margin:10px 0 0}
      .ok{color:var(--ok)}
      .bad{color:var(--bad)}

      #toast{
        position:fixed;
        left:50%;
        bottom:88px;
        transform:translateX(-50%) translateY(8px);
        background:var(--gold);
        color:#0B0D12;
        font-weight:600;
        font-size:13px;
        padding:10px 16px;
        border-radius:12px;
        opacity:0;
        transition:opacity .18s,transform .18s;
        pointer-events:none;
        z-index:60;
        max-width:calc(100vw - 32px);
        text-align:center;
      }
      #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

      @media(max-width:800px){
        #app.shell{display:flex;flex-direction:column;min-height:100dvh}
        .mob-bar{
          display:flex;
          align-items:center;
          justify-content:space-between;
          position:sticky;
          top:0;
          z-index:30;
          height:54px;
          padding:0 16px;
          background:rgba(11,13,18,.88);
          backdrop-filter:blur(12px);
          border-bottom:1px solid var(--bd);
        }
        .mob-bar .logo{margin:0;font-size:16px}
        .mob-lock{
          display:inline-flex;
          align-items:center;
          gap:6px;
          min-height:38px;
          padding:6px 12px;
          font-size:13px;
          border-radius:10px;
          background:var(--surface);
        }
        .mob-lock svg{width:16px;height:16px}

        aside{
          position:fixed;
          bottom:0;
          left:0;
          right:0;
          top:auto;
          width:100%;
          height:auto;
          z-index:40;
          flex-direction:row;
          display:grid;
          grid-template-columns:repeat(3,1fr);
          gap:4px;
          padding:6px 8px calc(6px + env(safe-area-inset-bottom));
          background:rgba(19,23,34,.94);
          backdrop-filter:blur(14px);
          border-top:1px solid var(--bd);
          border-right:0;
        }
        aside .logo,aside .desk-lock{display:none}
        .nv{
          flex-direction:column;
          justify-content:center;
          align-items:center;
          gap:3px;
          padding:6px 4px;
          min-height:50px;
          border-radius:10px;
          font-size:11px;
          text-align:center;
          border:0;
        }
        .nv.on{background:var(--gold-dim);border:0}
        .nv svg{width:20px;height:20px}
        main{padding:16px 14px calc(84px + env(safe-area-inset-bottom))}
        .card{padding:16px;border-radius:14px}
        .auth{margin:5dvh auto;padding:20px}
        .acts{grid-template-columns:1fr 1fr}
        .acts .btn.gold{grid-column:1 / -1}
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="auth card"><h1>DINO<span>SITIVE</span></h1><p class="mut">Memuat aplikasi…</p></div></div>
    <noscript><div class="auth card"><h1>DINO<span>SITIVE</span></h1><p class="err">Aktifkan JavaScript untuk menjalankan aplikasi ini.</p></div></noscript>
    <dialog id="dlg"></dialog>
    <div id="toast"></div>
    <script type="importmap">{"imports":{"hash-wasm":"https://cdn.jsdelivr.net/npm/hash-wasm@4.12.0/+esm"}}</script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
